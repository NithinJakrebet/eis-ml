PEIS-HC-RT_LOSO:
  experiment_type: "loso_cross_validation"
  data_folder: "PEIS-HC-RT"
  channels:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
  
  model_params:
    subset_size: 300
    top_k_freqs: null
  
  kernel_params:
    constant_value: 1.0
    constant_bounds: [0.01, 100.0]
    rbf_length_scale_bounds: [0.01, 100.0]
    white_noise_level: 0.001
    white_noise_bounds: 'fixed'
  
  gpr_params:
    alpha: 0.0
    normalize_y: true
    n_restarts_optimizer: 1
    random_state: 42
  
  paths:
    model_dir: "models/gpr_cross_loso"
    results_dir: "results/gpr"
    plots_dir: "results/plots/gpr_cross_loso"
  
  # Frequencies for dual Ns state vector
