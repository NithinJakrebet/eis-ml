    ns1: [0.254, 0.34, 0.456, 0.612, 0.822, 1.1, 1.48, 1.99, 2.66, 3.57, 4.8, 6.43, 8.64, 11.6, 15.5, 20.9, 28.0, 37.5, 50.3, 67.6, 90.6, 122.0, 163.0, 219.0, 294.0, 394.0, 529.0, 710.0, 952.0, 1280.0, 1710.0, 2300.0, 3090.0, 4140.0, 5560.0, 7450.0, 10000.0]
    ns6: [0.999, 1.33, 1.78, 2.37, 3.16, 4.22, 5.62, 7.5, 10.0, 13.3, 17.8, 23.7, 31.6, 42.2, 56.2, 75.0, 102.0, 135.0, 178.0, 237.0, 316.0, 422.0, 564.0, 750.0, 1000.0, 1330.0, 1780.0, 2370.0, 3160.0, 4220.0, 5620.0, 7500.0, 10000.0]
